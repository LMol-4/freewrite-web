name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm run lint
      - name: Unit and transaction tests
        run: pnpm exec vitest run
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare disposable Supabase
        id: prepare
        run: node scripts/local-test.mjs prepare
      # Fresh hosted runners have no saved DB volume: start replays all migrations.
      # Each browser gets its own runner/backend; offline tests must stay serial.
      - name: Start disposable Supabase and replay migrations
        run: node scripts/local-test.mjs start
      - name: Verify upgrade preserves existing data
        if: matrix.browser == 'chromium'
        run: node scripts/local-test.mjs upgrade-check
      - name: Build with local backend
        run: node scripts/local-test.mjs build
      - name: Install matching browser
        run: pnpm exec playwright install --with-deps --only-shell ${{ matrix.browser }}
      - name: Auth, RLS, Storage and browser tests
        run: node scripts/local-test.mjs test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop disposable Supabase
        if: always() && steps.prepare.outcome == 'success'
        run: node scripts/local-test.mjs stop
  # Preserve the existing required CI / test check for branch/deployment gates.
  test:
    if: always()
    needs: [checks, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks and both browsers
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSERS_RESULT" = success
