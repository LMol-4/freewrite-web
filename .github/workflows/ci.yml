name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a production migration/deployment with a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Verify release CLI installation and commands
        shell: bash
        run: |
          npm install --global vercel@50.0.1
          vercel --version
          # This pinned Vercel CLI returns 2 for help, unlike most CLIs.
          verify_vercel_help() {
            local help
            help=$(vercel "$1" --help 2>&1) || test "$?" -eq 2
            [[ "$help" == *"$2"* ]]
          }
          verify_vercel_help deploy --skip-domain
          verify_vercel_help promote --yes
          supabase link --help
          supabase db push --help
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm run lint
      - name: Unit and transaction tests
        run: pnpm exec vitest run
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare disposable Supabase
        id: prepare
        run: node scripts/local-test.mjs prepare
      # Fresh hosted runners have no saved DB volume: start replays all migrations.
      # Each browser gets its own runner/backend; offline tests must stay serial.
      - name: Configure reliable Ubuntu package downloads
        timeout-minutes: 1
        run: sudo python3 scripts/ci-prepare-apt.py
      - name: Start backend and install browser concurrently
        timeout-minutes: 9
        run: bash scripts/ci-start.sh ${{ matrix.browser }}
      - name: Verify upgrade preserves existing data
        if: matrix.browser == 'chromium'
        run: node scripts/local-test.mjs upgrade-check
      - name: Build with local backend
        run: node scripts/local-test.mjs build
      - name: Auth, RLS, Storage and browser tests
        run: node scripts/local-test.mjs test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            .local-test/ci-logs/
          retention-days: 7
      - name: Stop disposable Supabase
        if: always() && steps.prepare.outcome == 'success'
        run: node scripts/local-test.mjs stop
  # Preserve the existing required CI / test check for branch/deployment gates.
  test:
    if: always()
    needs: [checks, browsers, release-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks and both browsers
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
          RELEASE_TOOLS_RESULT: ${{ needs.release-tools.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSERS_RESULT" = success
          test "$RELEASE_TOOLS_RESULT" = success
  release:
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-release
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject outdated release reruns
        shell: bash
        run: |
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)" || { echo 'Release must target current main. Run CI on main again.'; exit 1; }
      - name: Check release credentials
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            test -n "${!name}" || { echo "Missing GitHub production setting: $name"; exit 1; }
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: pnpm install --frozen-lockfile
      - name: Install deployment CLI
        # setup-node provides npm's global bin on PATH. Avoid pnpm's separate
        # global-bin configuration; app dependencies still use locked pnpm.
        run: npm install --global vercel@50.0.1
      - name: Link production database
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Check pending migrations without applying
        run: supabase db push --linked --dry-run
      - name: Verify database verification permissions
        run: node scripts/check-production.mjs --database-access
      - name: Build staged production deployment on Vercel
        id: stage
        shell: bash
        run: |
          deployment_url=$(vercel deploy --prod --skip-domain --yes --build-env SUPABASE_PROJECT_REF="$SUPABASE_PROJECT_REF" --token="$VERCEL_TOKEN")
          [[ "$deployment_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]] || { echo 'Invalid staged deployment URL'; exit 1; }
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Apply pending migrations
        run: supabase db push --linked --yes
      - name: Verify MCP database access
        run: node scripts/check-production.mjs --database
      - name: Promote verified deployment
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: vercel promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
